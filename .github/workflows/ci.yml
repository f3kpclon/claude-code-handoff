name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        with:
          scandir: '.'
          ignore_paths: addons

  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Run test suite
        run: bash test.sh

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - name: Scan for dangerous patterns
        run: |
          # Includes test.sh: CI runs `bash test.sh`, so a payload there executes
          # on the runner — it must be scanned, not just the shipped files.
          # ci.yml is deliberately NOT scanned: the scan patterns live in this
          # file (self-match), and a malicious workflow edit just deletes this
          # job anyway — the real control there is CODEOWNERS + branch protection.
          SENSITIVE_FILES=$(find hooks/ skills/ install.sh uninstall.sh test.sh -type f 2>/dev/null)
          FOUND=0

          # Una línea marcada con `# net-allow:` queda exenta. La feature de cupo
          # mensual ES una llamada saliente: sin exención el gate obliga a
          # borrarlo entero, y borrarlo deja de avisar del resto. La marca es
          # estrecha a propósito — exime esa línea y ninguna otra, aparece en el
          # diff de cualquier PR y el control real sigue siendo CODEOWNERS +
          # branch protection.
          scan() {
            local pattern="$1"
            local label="$2"
            while IFS= read -r hit; do
              case "$hit" in *'# net-allow:'*) continue ;; esac
              echo "⚠ $label → $hit"
              FOUND=$((FOUND+1))
            done < <(grep -rnE "$pattern" $SENSITIVE_FILES 2>/dev/null)
          }

          scan 'curl '                 'outbound curl'
          scan 'wget '                 'outbound wget'
          scan 'base64 -d'             'base64 decode (payload obfuscation)'
          scan '/dev/tcp'              'raw TCP connection'
          scan '(^|[^[:alnum:]])nc '   'netcat'
          scan 'python3 -c.*exec'      'dynamic python exec'
          # No exentables: la marca `# net-allow:` cubre el GET de consulta y
          # nada más. Cualquier cosa que MANDE datos hacia afuera falla igual,
          # marcada o no — es la diferencia entre consultar y exfiltrar.
          while IFS= read -r hit; do
            echo "⚠ outbound upload (never allowed) → $hit"
            FOUND=$((FOUND+1))
          done < <(grep -rnE '(--data|--form|-X[[:space:]]*(POST|PUT|PATCH)|--upload-file)' $SENSITIVE_FILES 2>/dev/null)
          scan '(^|[^[:alnum:]])eval ' 'dynamic eval'

          if [ "$FOUND" -gt 0 ]; then
            echo ""
            echo "Security scan failed: $FOUND suspicious pattern(s) detected in sensitive files."
            echo "Review the findings above before merging."
            exit 1
          fi

          echo "Security scan passed."
